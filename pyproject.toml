[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nusadb"
version = "0.1.2"
description = "Pure-Python PEP-249 (DB-API 2.0) driver for NusaDB (Nusa Wire Protocol)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "NusaDB Authors" }]
keywords = ["nusadb", "database", "sql", "dbapi", "pep249"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["SQLAlchemy>=2.0"]
asyncio = ["SQLAlchemy[asyncio]>=2.0"]

[project.entry-points."sqlalchemy.dialects"]
nusadb = "nusadb.sqlalchemy:NusaDialect"
"nusadb.asyncio" = "nusadb.sqlalchemy:NusaDialect_asyncio"

[project.urls]
Repository = "https://github.com/nusadb/python"
Issues = "https://github.com/nusadb/python/issues"

[tool.setuptools.packages.find]
include = ["nusadb*"]
