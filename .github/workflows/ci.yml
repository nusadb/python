name: CI

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The test suite (tests/) boots a real `nusadb-server` binary, which is not present
      # in this repository, so it cannot run here. These checks are what can be verified
      # standalone: everything compiles, the package imports, and the dialect entry point
      # this package advertises to SQLAlchemy actually resolves.
      - name: Compile all sources
        run: python -m compileall -q nusadb

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Import the driver
        run: |
          python -c "
          import nusadb
          assert hasattr(nusadb, 'connect'), 'nusadb.connect is missing'
          assert nusadb.apilevel == '2.0', f'unexpected apilevel {nusadb.apilevel!r}'
          print('nusadb imports; DB-API', nusadb.apilevel)
          "

      - name: Resolve the SQLAlchemy dialect entry point
        run: |
          python -m pip install 'SQLAlchemy>=1.4'
          python -c "
          from nusadb.sqlalchemy import NusaDialect
          print('dialect ok:', NusaDialect.__name__)
          "

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the artifacts
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
